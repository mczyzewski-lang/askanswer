services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: askby
      POSTGRES_PASSWORD: askby
      POSTGRES_DB: askby
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/askby-media; mc anonymous set none local/askby-media; exit 0"
volumes:
  pgdata:
  miniodata:
